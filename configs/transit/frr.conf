hostname transit
!
interface eth1
 ip address 10.0.1.2/30
!
interface eth2
 ip address 10.0.2.1/30
!
interface eth3
 ip address 10.0.3.1/30
!
ip prefix-list PL-ATTACKER-IN seq 5 permit 192.0.2.0/24
!
router bgp 65001
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.1.1 remote-as 65010
 neighbor 10.0.1.1 description victim
 neighbor 10.0.2.2 remote-as 65020
 neighbor 10.0.2.2 description user
 neighbor 10.0.3.2 remote-as 65666
 neighbor 10.0.3.2 description attacker
 !
 address-family ipv4 unicast
  neighbor 10.0.1.1 activate
  neighbor 10.0.2.2 activate
  neighbor 10.0.3.2 activate
  neighbor 10.0.3.2 prefix-list PL-ATTACKER-IN in
 exit-address-family
!
