name: bgp-lab

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.7.1
  nodes:
    victim:
      binds:
        - configs/victim/daemons:/etc/frr/daemons:ro
        - configs/victim/frr.conf:/etc/frr/frr.conf:ro
        - configs/victim/vtysh.conf:/etc/frr/vtysh.conf:ro
    transit:
      binds:
        - configs/transit/daemons:/etc/frr/daemons:ro
        - configs/transit/frr.conf:/etc/frr/frr.conf:ro
        - configs/transit/vtysh.conf:/etc/frr/vtysh.conf:ro
    user:
      binds:
        - configs/user/daemons:/etc/frr/daemons:ro
        - configs/user/frr.conf:/etc/frr/frr.conf:ro
        - configs/user/vtysh.conf:/etc/frr/vtysh.conf:ro
    attacker:
      binds:
        - configs/attacker/daemons:/etc/frr/daemons:ro
        - configs/attacker/frr.conf:/etc/frr/frr.conf:ro
        - configs/attacker/vtysh.conf:/etc/frr/vtysh.conf:ro
    rtr:
      image: rpki/stayrtr:latest
      mgmt-ipv4: 172.20.20.200
      entrypoint: /stayrtr
      cmd: -cache /roas.json -bind :3323 -checktime=false
      binds:
        - rpki/roas.json:/roas.json:ro
    gobmp:
      image: sbezverk/gobmp:latest
      mgmt-ipv4: 172.20.20.201
      cmd: --dump=console --source-port=5000
  links:
    - endpoints: ["victim:eth1", "transit:eth1"]
    - endpoints: ["transit:eth2", "user:eth1"]
    - endpoints: ["transit:eth3", "attacker:eth1"]
